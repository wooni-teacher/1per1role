/* =========================================================

   비워 두면 '체험 모드'(이 브라우저 안에서만 저장)로 동작해요.
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD-a2gTWcPZnrGeURBJi9aWa2_Jxgan8ek",
  authDomain: "per1roll.firebaseapp.com",
  databaseURL: "https://per1roll-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "per1roll",
  storageBucket: "per1roll.firebasestorage.app",
  messagingSenderId: "972221913990",
  appId: "1:972221913990:web:2d87875585321320adaa07"
};
const TEACHER_PIN = "126758";          // 선생님 화면 비밀번호
const TIMES = ['아침 시간','쉬는 시간','점심 시간','수업 시간','하교 전'];

const DEFAULT_ROLES = [
  ['🦎','히로 돌보미','히로 먹이·물 챙기고 사육장 온도 확인하기','히로가 건강하려면 매일 같은 시간에 돌봐 줄 친구가 꼭 필요해요.','아침 시간',2],
  ['🧽','칠판 지킴이','수업이 끝나면 칠판 깨끗하게 지우기','다음 수업을 깨끗한 칠판에서 바로 시작할 수 있어요.','쉬는 시간',1],
  ['♻️','분리수거 대장','종이·플라스틱·캔을 나누어 버리기','쓰레기를 잘 나누면 교실도 깨끗하고 지구도 지킬 수 있어요.','하교 전',2],
  ['💡','전기 지킴이','빈 교실 전등 끄고 창문 닫기','전기를 아끼고, 비바람이 들어오지 않게 막아 줘요.','하교 전',1],
  ['🌱','식물 친구','교실 화분에 물 주기','식물은 스스로 물을 마실 수 없어서 우리가 챙겨야 해요.','아침 시간',1],
  ['📮','우편 배달부','가정통신문·학습지 나누어 주기','선생님과 친구들이 기다리지 않고 빠르게 받을 수 있어요.','아침 시간',1],
  ['🍚','급식 도우미','급식 줄 정리하고 잔반 정리 돕기','점심시간이 질서 있고 안전해져요.','점심 시간',2],
  ['📚','학급문고 사서','책꽂이의 책을 가지런히 정리하기','읽고 싶은 책을 쉽게 찾을 수 있어요.','쉬는 시간',1],
  ['🧹','바닥 청소 요정','교실 바닥 쓸고 의자 밀어 넣기','먼지가 없어야 우리가 건강하게 지낼 수 있어요.','하교 전',2],
  ['👟','신발장 정리왕','신발장 신발을 가지런히 정리하기','신발이 섞이거나 잃어버리지 않아요.','하교 전',1],
  ['📱','태블릿 관리자','태블릿 개수 확인하고 충전기 꽂기','다음 시간에 모두가 충전된 태블릿을 쓸 수 있어요.','수업 시간',1]
];
const DEFAULT_NAMES = ['김다온','김도영','김채화','백수민','소진호','신은비','유준선','윤하늘',
  '이보현','이지은','임규원','임휘재','장문혁','장준혁','한승우'];

/* ---------------- 저장소 (Firebase 또는 체험 모드) ---------------- */
const params = new URLSearchParams(location.search);
const ROOM = (params.get('room') || 'banwol').replace(/[.#$\[\]\/\s]/g,'') || 'banwol';
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));

function makeFirebaseStore(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();
  const root = db.ref('oneRoleV2/' + ROOM);
  let offset = 0;
  db.ref('.info/serverTimeOffset').on('value', s => offset = s.val() || 0);
  return {
    mode: 'firebase',
    now: () => Date.now() + offset,
    subscribe(cb){ root.on('value', s => cb(s.val() || {})); },
    update(map){ return root.update(map); },
    set(path, val){ return root.child(path).set(val); },
    claim(path, val){ return root.child(path).transaction(cur => cur ? undefined : val).then(r => r.committed); }
  };
}
function makeLocalStore(){
  const KEY = 'oneRole_' + ROOM;
  let mem = {}; const subs = [];
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return clone(mem); } };
  const write = o => { mem = o; try { localStorage.setItem(KEY, JSON.stringify(o)); } catch(e){} subs.forEach(cb => cb(clone(o))); };
  window.addEventListener('storage', e => { if (e.key === KEY){ const o = read(); subs.forEach(cb => cb(o)); } });
  const setPath = (o, path, val) => {
    const p = path.split('/'); let c = o;
    for (let i = 0; i < p.length - 1; i++){ if (typeof c[p[i]] !== 'object' || c[p[i]] === null) c[p[i]] = {}; c = c[p[i]]; }
    const last = p[p.length - 1];
    if (val === null || val === undefined) delete c[last]; else c[last] = clone(val);
  };
  const getPath = (o, path) => path.split('/').reduce((c, k) => c == null ? undefined : c[k], o);
  return {
    mode: 'local',
    now: () => Date.now(),
    subscribe(cb){ subs.push(cb); cb(read()); },
    update(map){ const o = read(); for (const k in map) setPath(o, k, map[k]); write(o); return Promise.resolve(); },
    set(path, val){ return this.update({[path]: val}); },
    claim(path, val){ const o = read(); if (getPath(o, path)) return Promise.resolve(false); setPath(o, path, val); write(o); return Promise.resolve(true); }
  };
}
let store;
try { store = (window.firebase && FIREBASE_CONFIG.apiKey) ? makeFirebaseStore() : makeLocalStore(); }
catch(e){ console.error(e); store = makeLocalStore(); }

/* ---------------- 상태 ---------------- */
let S = {}, loaded = false, closing = false, initDone = false, pending = false;
const ui = { bigView: false };
const me = { role: null, sid: null };
try {
  if (params.get('mode') === 'student') me.role = 'student';
  if (sessionStorage.getItem('oneRole_t_' + ROOM) === '1' && params.get('mode') !== 'student') me.role = 'teacher';
  me.sid = localStorage.getItem('oneRole_sid_' + ROOM);
} catch(e){}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 8);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const roles = () => Object.entries(S.roles || {}).map(([id, r]) => ({id, ...r})).sort((a, b) => (a.order || 0) - (b.order || 0));
const students = () => Object.entries(S.students || {}).map(([id, s]) => ({id, ...s})).sort((a, b) => a.no - b.no);
const assigned = () => S.assigned || {};
const stuName = id => S.students?.[id]?.name || '?';
const rem = rid => (+S.roles?.[rid]?.slots || 0) - Object.values(assigned()).filter(x => x === rid).length;
const unassigned = () => students().filter(s => !assigned()[s.id]);
const totalSlots = () => roles().reduce((a, r) => a + (+r.slots || 0), 0);
const dur = () => S.settings?.duration || 180;
const studentLink = () => location.origin + location.pathname + '?room=' + encodeURIComponent(ROOM) + '&mode=student';

function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

function defaultsMap(){
  const up = {};
  DEFAULT_ROLES.forEach((d, i) => {
    up['roles/r' + String(i + 1).padStart(2, '0')] = {emoji: d[0], name: d[1], desc: d[2], reason: d[3], time: d[4], slots: d[5], order: i};
  });
  DEFAULT_NAMES.forEach((n, i) => up['students/s' + String(i + 1).padStart(2, '0')] = {no: i + 1, name: n});
  up.phase = 'setup'; up['settings/duration'] = 180;
  return up;
}

/* ---------------- 동작 ---------------- */
const act = {
  asStudent(){ me.role = 'student'; render(); },
  asTeacher(){
    const pin = prompt('선생님 비밀번호를 입력하세요');
    if (pin !== TEACHER_PIN){ if (pin !== null) toast('비밀번호가 달라요'); return; }
    me.role = 'teacher'; try { sessionStorage.setItem('oneRole_t_' + ROOM, '1'); } catch(e){}
    render();
  },
  logoutTeacher(){ me.role = null; try { sessionStorage.removeItem('oneRole_t_' + ROOM); } catch(e){} render(); },
  chooseMe(sid){ me.sid = sid; try { localStorage.setItem('oneRole_sid_' + ROOM, sid); } catch(e){} render(); },
  forgetMe(){ me.sid = null; try { localStorage.removeItem('oneRole_sid_' + ROOM); } catch(e){} render(); },
  toggleBig(){ ui.bigView = !ui.bigView; render(); },

  editRole(id, f, v){ store.set('roles/' + id + '/' + f, v); },
  slot(id, d){ const n = Math.max(1, Math.min(15, (+S.roles[id].slots || 1) + d)); store.set('roles/' + id + '/slots', n); },
  addRole(){
    const order = Math.max(0, ...roles().map(r => r.order || 0)) + 1;
    store.set('roles/' + uid('r'), {emoji: '⭐', name: '새 역할', desc: '', reason: '', time: '쉬는 시간', slots: 1, order});
  },
  delRole(id){ if (confirm('“' + S.roles[id].name + '” 역할을 지울까요?')) store.set('roles/' + id, null); },
  saveNames(){
    const lines = document.getElementById('names').value.split('\n').map(s => s.trim()).filter(Boolean);
    if (!lines.length) return toast('이름을 한 명 이상 적어 주세요');
    const st = {}; lines.forEach((n, i) => st['s' + String(i + 1).padStart(2, '0')] = {no: i + 1, name: n});
    store.update({students: st}).then(() => toast('명단을 저장했어요 (' + lines.length + '명)'));
  },
  setDur(s){ store.set('settings/duration', s); },

  startRound(){
    const first = (S.phase || 'setup') === 'setup';
    const d = dur();
    const up = {phase: 'apply', round: first ? 1 : (S.round || 1) + 1, picks: null, games: null, endsAt: store.now() + d * 1000, duration: d};
    if (first) up.assigned = null;
    store.update(up);
  },
  addTime(sec){ store.update({endsAt: (S.endsAt || store.now()) + sec * 1000, duration: (S.duration || dur()) + sec}); },

  pick(rid){
    if (S.phase !== 'apply' || store.now() > (S.endsAt || 0)) return toast('지원 시간이 끝났어요');
    if (assigned()[me.sid]) return;
    store.set('picks/' + me.sid, rid);
  },

  async closeRound(){
    if (closing || S.phase !== 'apply') return;
    closing = true;
    try {
      const picks = S.picks || {}, un = unassigned(), up = {}, games = {}, byRole = {};
      un.forEach(s => { const r = picks[s.id]; if (r && S.roles?.[r] && rem(r) > 0) (byRole[r] = byRole[r] || []).push(s.id); });
      let newly = 0;
      for (const [rid, ids] of Object.entries(byRole)){
        const R = rem(rid);
        if (ids.length <= R){ ids.forEach(id => { up['assigned/' + id] = rid; newly++; }); }
        else {
          const wins = shuffle([...Array(ids.length).keys()]).slice(0, R);
          const cards = {}; for (let i = 0; i < ids.length; i++) cards['c' + i] = {win: wins.includes(i)};
          const players = {}; ids.forEach(id => players[id] = true);
          games[rid] = {slots: R, players, cards, revealed: false};
        }
      }
      const hasGame = Object.keys(games).length > 0;
      up.games = hasGame ? games : null;
      up.phase = hasGame ? 'game' : (un.length - newly === 0 ? 'done' : 'closed');
      up.endsAt = null;
      await store.update(up);
    } finally { closing = false; }
  },

  async pickCard(rid, cid){
    const g = S.games?.[rid];
    if (!g || g.revealed || !g.players?.[me.sid]) return;
    if (Object.values(g.cards || {}).some(c => c.by === me.sid)) return;
    const ok = await store.claim('games/' + rid + '/cards/' + cid + '/by', me.sid);
    if (!ok) toast('앗, 다른 친구가 먼저 골랐어요! 다른 카드를 골라요');
  },
  autoFill(rid, up){
    const g = S.games[rid]; const cards = g.cards || {};
    const taken = new Set(Object.values(cards).map(c => c.by).filter(Boolean));
    const waiting = shuffle(Object.keys(g.players || {}).filter(p => !taken.has(p)));
    const free = Object.keys(cards).filter(cid => !cards[cid].by);
    waiting.forEach((sid, i) => { if (free[i]) up['games/' + rid + '/cards/' + free[i] + '/by'] = sid; });
    return up;
  },
  autoPick(rid){ store.update(act.autoFill(rid, {})); },
  revealUp(rid, up){
    act.autoFill(rid, up);
    const cards = S.games[rid].cards || {};
    for (const cid in cards){
      const by = up['games/' + rid + '/cards/' + cid + '/by'] || cards[cid].by;
      if (cards[cid].win && by) up['assigned/' + by] = rid;
    }
    up['games/' + rid + '/revealed'] = true;
    return up;
  },
  reveal(rid){ store.update(act.revealUp(rid, {})); },
  revealAll(){
    const up = {};
    Object.entries(S.games || {}).forEach(([rid, g]) => { if (!g.revealed) act.revealUp(rid, up); });
    store.update(up);
  },
  afterGames(){ store.update({games: null, phase: unassigned().length ? 'closed' : 'done'}); },

  randomRest(){
    const un = shuffle(unassigned().map(s => s.id));
    const seats = []; roles().forEach(r => { for (let i = 0; i < rem(r.id); i++) seats.push(r.id); });
    shuffle(seats);
    const up = {}; let left = un.length;
    un.forEach((sid, i) => { if (seats[i]){ up['assigned/' + sid] = seats[i]; left--; } });
    up.phase = left === 0 ? 'done' : 'closed';
    store.update(up);
  },
  backToSetup(){
    if (!confirm('배정 결과를 지우고 역할 토의 단계로 돌아갈까요? (역할과 명단은 그대로 남아요)')) return;
    store.update({phase: 'setup', assigned: null, picks: null, games: null, round: null, endsAt: null});
  },
  resetAll(){
    if (!confirm('역할·명단·결과를 모두 지우고 기본값으로 되돌릴까요?')) return;
    store.update(Object.assign({roles: null, students: null, assigned: null, picks: null, games: null, round: null, endsAt: null}, {}))
      .then(() => store.update(defaultsMap()));
  },
  print(){ window.print(); }
};

    ${extra}</div>`;
}
function roleEditor(r){
  return `<div class="rcard edit">
    <div class="row"><input class="emoji" value="${esc(r.emoji)}" onchange="act.editRole('${r.id}','emoji',this.value)">
      <input class="rname" value="${esc(r.name)}" placeholder="역할 이름" onchange="act.editRole('${r.id}','name',this.value)">

    <label>🕘 하는 시간</label><div class="chips sm">${TIMES.map(t => `<button class="chip ${r.time === t ? 'on' : ''}" onclick="act.editRole('${r.id}','time','${t}')">${t}</button>`).join('')}</div>
    <label>👥 인원</label><div class="stepper"><button onclick="act.slot('${r.id}',-1)">−</button><b>${r.slots}명</b><button onclick="act.slot('${r.id}',1)">＋</button></div>
  </div>`;
}
const timerHtml = () => `<div class="timer" data-timer><div class="tnum">--</div><div class="tbar"><i></i></div></div>`;
function stepper(){
  const p = S.phase || 'setup';
  const idx = {setup: 0, apply: 1, game: 2, closed: 2, done: 3}[p] ?? 0;
  const st = ['① 역할 토의', '② 지원하기', '③ 미니게임', '④ 결과'];
  return `<div class="steps">${st.map((s, i) => `<span class="${i === idx ? 'on' : i < idx ? 'done' : ''}">${s}</span>`).join('')}</div>`;
}
function modeBanner(){
  return store.mode === 'local' ? `<div class="banner">🧪 <b>체험 모드</b>예요. 이 브라우저 안에서만 저장돼요. 다른 탭에서 <code>?mode=student</code> 주소로 열면 학생 화면을 함께 시험해 볼 수 있어요. 여러 태블릿에서 쓰려면 파일 위쪽의 <code>FIREBASE_CONFIG</code>를 채워 주세요.</div>` : '';
}
function linkPanel(){
  const l = studentLink();
  return `<section class="panel noprint"><h3>📲 학생 접속 주소</h3><div class="qr">
    <img width="150" height="150" alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(l)}" onerror="this.remove()">
    <div><code>${esc(l)}</code><p class="hint">태블릿으로 QR을 찍거나 주소를 열고, 자기 이름을 누르면 돼요.</p></div></div></section>`;
}
function resultBoard(){
  const A = assigned(), rs = roles();
  const times = [...TIMES, ...new Set(rs.map(r => r.time).filter(t => !TIMES.includes(t)))];

function myRoleBox(r, title = '나의 역할'){
  return `<div class="myrole"><div class="em">${esc(r.emoji)}</div><div class="hint">${title}</div><h2>${esc(r.name)}</h2>
    <div class="tag">🕘 ${esc(r.time)}</div>${r.desc ? `<p>🛠 ${esc(r.desc)}</p>` : ''}</div>`;
}
function cardHtml(rid, cid, c, g, who){
  const mine = who !== 'teacher' && c.by && c.by === me.sid;
  const showName = who === 'teacher' || g.revealed;
  const label = c.by ? (showName ? esc(stuName(c.by)) : (mine ? '내 카드' : '선택됨')) : '';
  const canPick = who === 'student' && !g.revealed && !c.by && g.players?.[me.sid] && !Object.values(g.cards || {}).some(x => x.by === me.sid);
  return `<button class="pcard ${g.revealed ? 'flip' : ''} ${c.by ? 'taken' : ''} ${mine ? 'mine' : ''} ${g.revealed && c.win ? 'win' : ''}" ${canPick ? `onclick="act.pickCard('${rid}','${cid}')"` : 'disabled'}>
    <span class="inner"><span class="back">❓<small>${label}</small></span><span class="front">${c.win ? '🎉' : '🍀'}<small>${label}</small></span></span></button>`;
}
function gameBoard(rid, g, who){
  const r = S.roles?.[rid] || {};
  const cards = Object.entries(g.cards || {}).sort((a, b) => +a[0].slice(1) - +b[0].slice(1));
  const players = Object.keys(g.players || {});
  const taken = new Set(cards.map(([, c]) => c.by).filter(Boolean));
  const waiting = players.filter(p => !taken.has(p));
  return `<section class="panel center">
    <h3>${esc(r.emoji)} ${esc(r.name)} — <b>${g.slots}</b>자리에 <b>${players.length}</b>명 지원</h3>
    <div class="cards">${cards.map(([cid, c]) => cardHtml(rid, cid, c, g, who)).join('')}</div>
    ${who === 'teacher' && !g.revealed ? `<div class="row center">
      ${waiting.length ? `<span class="hint">카드 고르는 중: ${waiting.map(p => esc(stuName(p))).join(', ')}</span><button class="btn" onclick="act.autoPick('${rid}')">남은 카드 대신 뽑기</button>` : '<span class="hint">모두 골랐어요!</span>'}
      <button class="btn primary" onclick="act.reveal('${rid}')">✨ 결과 공개</button></div>` : ''}
  </section>`;
}

  <section class="panel"><h2>⏱️ 지원 시간</h2>

    return `<div class="rcard ${cls}"><div class="rtop"><span class="em">${esc(r.emoji)}</span><div><div class="rn">${esc(r.name)}</div><div class="tag">🕘 ${esc(r.time)}</div></div>
      <div class="count">${ap.length}<small>/${R}</small></div></div>
      <div class="names">${ap.map(s => `<span class="nm">${esc(s.name)}</span>`).join('') || '<span class="hint">아직 없어요</span>'}</div>

function tGame(){

  const allRev = gs.every(([, g]) => g.revealed);
  return `<section class="panel center"><h2>🎲 미니게임: 행운의 카드 뽑기</h2>
    <p class="hint">자리보다 지원자가 많은 역할이에요. 지원한 친구들이 자기 태블릿에서 카드를 한 장씩 골라요.<br>🎉 카드를 뽑은 친구가 그 역할을 맡고, 🍀 카드를 뽑은 친구는 다음 지원에서 다시 골라요.</p>

function teacherView(){
  if (loaded && !S.roles && !initDone){ initDone = true; store.update(defaultsMap()); }

  const body = {setup: tSetup, apply: tApply, game: tGame, closed: tClosed, done: tDone}[p] || tSetup;

/* ---------------- 학생 화면 ---------------- */
function sPickName(){
  const st = students();
  if (!st.length) return `<div class="home"><div class="logo">⏳</div><h2>선생님이 준비하고 있어요</h2></div>`;
  return `<section class="panel center"><h2>🙋 내 이름을 눌러 주세요</h2>
    <div class="namegrid">${st.map(s => `<button class="btn" onclick="act.chooseMe('${s.id}')">${s.no}. ${esc(s.name)}</button>`).join('')}</div></section>`;
}
function studentView(){
  if (!loaded) return `<div class="home"><div class="logo">⏳</div><h2>연결하는 중…</h2></div>`;
  if (!me.sid || !S.students?.[me.sid]) return sPickName();
  const head = `<div class="me">👋 <b>${esc(stuName(me.sid))}</b> <button class="link" onclick="act.forgetMe()">내가 아니에요</button></div>`;
  const p = S.phase || 'setup';
  const mr = S.roles?.[assigned()[me.sid]];
  let body = '';
  if (p === 'setup'){
    body = `<section class="panel center"><h2>💬 역할 토의 중</h2><p>어떤 역할이 우리 반에 필요할까요? 카드를 읽고 내가 하고 싶은 역할을 생각해 봐요!</p></section>
      <div class="grid">${roles().map(r => roleCard(r)).join('')}</div>`;
  } else if (p === 'apply'){
    if (mr) body = myRoleBox(mr, '이미 정해진 나의 역할') + `<p class="center hint">친구들이 지원하고 있어요. 잠시 기다려요!</p>`;
    else {
      const picks = S.picks || {}, un = unassigned(), myPick = picks[me.sid];
      const expired = store.now() > (S.endsAt || 0);
      const open = roles().filter(r => rem(r.id) > 0);
      body = `<section class="panel center"><h2>${S.round}차 지원</h2>${timerHtml()}
        <p>${expired ? '⏰ 마감! 결과를 기다려요.' : '하고 싶은 역할을 눌러 지원하세요. 마감 전까지는 바꿀 수 있어요.'}</p></section>
        <div class="grid">${open.map(r => {
          const cnt = un.filter(s => picks[s.id] === r.id).length, R = rem(r.id), mine = myPick === r.id;
          const extra = `<div class="applybar">지원 ${cnt}명 / ${R}자리 ${mine ? '<span class="mine">✅ 내가 지원했어요</span>' : ''}</div>`;
          return roleCard({...r, slots: R}, extra, (mine ? 'picked ' : '') + (expired ? '' : 'tap'), expired ? '' : `act.pick('${r.id}')`);
        }).join('')}</div>`;
    }
  } else if (p === 'game'){
    const gs = Object.entries(S.games || {});
    const myGame = gs.find(([, g]) => g.players?.[me.sid]);
    if (myGame){
      const [rid, g] = myGame;
      const myCard = Object.values(g.cards || {}).find(c => c.by === me.sid);
      let msg = myCard ? '카드를 골랐어요! 선생님이 결과를 공개할 때까지 기다려요 🤞' : '🃏 카드를 한 장 골라 주세요!';
      if (g.revealed) msg = myCard?.win ? `🎉 축하해요! <b>${esc(S.roles[rid].name)}</b> 역할을 맡게 됐어요!` : '🍀 아쉽지만 다음 지원에서 다른 역할을 골라 봐요!';
      body = `<div class="result-msg">${msg}</div>${gameBoard(rid, g, 'student')}`;
    } else {
      body = (mr ? myRoleBox(mr) : '') + `<section class="panel center"><h2>🎲 친구들이 미니게임 중이에요</h2></section>` +
        gs.map(([rid, g]) => gameBoard(rid, g, 'view')).join('');
    }
  } else if (p === 'closed'){
    body = mr ? myRoleBox(mr) + `<p class="center hint">남은 친구들의 다음 지원을 기다려요.</p>`
      : `<section class="panel center"><h2>🙌 다음 지원을 준비하고 있어요</h2><p>남은 역할 중에서 하고 싶은 것을 미리 골라 둬요!</p></section>
         <div class="grid">${roles().filter(r => rem(r.id) > 0).map(r => roleCard({...r, slots: rem(r.id)})).join('')}</div>`;
  } else if (p === 'done'){
    body = (mr ? myRoleBox(mr) : '') + resultBoard();
  }
  return head + stepper() + body;
}

/* ---------------- 그리기 ---------------- */
function home(){
  return `<div class="home"><div class="logo">🙋</div><h1>우리 반 1인 1역</h1><p>역할을 토의하고, 지원하고, 함께 정해요!</p>
    <button class="btn big primary" onclick="act.asStudent()">🧒 학생으로 들어가기</button>
    <button class="btn big" onclick="act.asTeacher()">🧑‍🏫 선생님</button>${modeBanner()}</div>`;
}
function render(){
  const a = document.activeElement;
  if (a && a.closest && a.closest('#app') && /^(INPUT|TEXTAREA)$/.test(a.tagName)){ pending = true; return; }
  const y = window.scrollY;
  document.getElementById('app').innerHTML = me.role === 'teacher' ? teacherView() : me.role === 'student' ? studentView() : home();
  window.scrollTo(0, y);
  tick();
}
document.addEventListener('focusout', () => { if (pending){ pending = false; setTimeout(render, 300); } });

let lastExpired = null;
function tick(){
  if (S.phase !== 'apply') return;
  const left = Math.max(0, (S.endsAt || 0) - store.now());
  const total = (S.duration || dur()) * 1000;
  document.querySelectorAll('[data-timer]').forEach(el => {
    const s = Math.ceil(left / 1000);
    el.querySelector('.tnum').textContent = left > 0 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : '마감!';
    el.querySelector('.tbar i').style.width = Math.min(100, left / total * 100) + '%';
    el.classList.toggle('hurry', left < 10000);
  });
  if (left <= 0){
    if (me.role === 'teacher') act.closeRound();
    else if (lastExpired !== S.round + ':' + S.endsAt){ lastExpired = S.round + ':' + S.endsAt; render(); }
  }
}
setInterval(tick, 250);

store.subscribe(v => { S = v || {}; loaded = true; render(); });
render();
</script>
</body>
</html>

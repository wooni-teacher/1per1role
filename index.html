/* ---------------- 저장소 (Firebase 또는 체험 모드) ---------------- */
const params = new URLSearchParams(location.search);
const ROOM = (params.get('room') || 'banwol').replace(/[.#$\[\]\/\s]/g,'') || 'banwol';
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));

function makeFirebaseStore(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();
  const root = db.ref('oneRoleV2/' + ROOM);
  let offset = 0;
  db.ref('.info/serverTimeOffset').on('value', s => offset = s.val() || 0);
  return {
    mode: 'firebase',
    now: () => Date.now() + offset,
    subscribe(cb){ root.on('value', s => cb(s.val() || {})); },
    update(map){ return root.update(map); },
    set(path, val){ return root.child(path).set(val); },
    claim(path, val){ return root.child(path).transaction(cur => cur ? undefined : val).then(r => r.committed); }
  };
}
function makeLocalStore(){
  const KEY = 'oneRole_' + ROOM;
  let mem = {}; const subs = [];
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return clone(mem); } };
  const write = o => { mem = o; try { localStorage.setItem(KEY, JSON.stringify(o)); } catch(e){} subs.forEach(cb => cb(clone(o))); };
  window.addEventListener('storage', e => { if (e.key === KEY){ const o = read(); subs.forEach(cb => cb(o)); } });
  const setPath = (o, path, val) => {
    const p = path.split('/'); let c = o;
    for (let i = 0; i < p.length - 1; i++){ if (typeof c[p[i]] !== 'object' || c[p[i]] === null) c[p[i]] = {}; c = c[p[i]]; }
    const last = p[p.length - 1];
    if (val === null || val === undefined) delete c[last]; else c[last] = clone(val);
  };
  const getPath = (o, path) => path.split('/').reduce((c, k) => c == null ? undefined : c[k], o);
  return {
    mode: 'local',
    now: () => Date.now(),
    subscribe(cb){ subs.push(cb); cb(read()); },
    update(map){ const o = read(); for (const k in map) setPath(o, k, map[k]); write(o); return Promise.resolve(); },
    set(path, val){ return this.update({[path]: val}); },
    claim(path, val){ const o = read(); if (getPath(o, path)) return Promise.resolve(false); setPath(o, path, val); write(o); return Promise.resolve(true); }
  };
}
let store;
try { store = (window.firebase && FIREBASE_CONFIG.apiKey) ? makeFirebaseStore() : makeLocalStore(); }
catch(e){ console.error(e); store = makeLocalStore(); }

/* ---------------- 상태 ---------------- */
let S = {}, loaded = false, closing = false, initDone = false, seatInitDone = false, pending = false;
let MOD = 'role';   // 지금 다루는 활동: 'role'(1인 1역) | 'seat'(자리 배치)
const emptyDraft = () => ({name: '', desc: '', reason: '', time: '쉬는 시간', slots: 1});
const ui = { mod: null, bigView: false, draft: emptyDraft(), idea: '', paint: 'z1', sel: [], swap: null };
const me = { role: null, sid: null };
try {
  if (params.get('mode') === 'student') me.role = 'student';
  if (sessionStorage.getItem('oneRole_t_' + ROOM) === '1' && params.get('mode') !== 'student') me.role = 'teacher';
  me.sid = localStorage.getItem('oneRole_sid_' + ROOM);
} catch(e){}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 8);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const isSeat = () => MOD === 'seat';
const D = () => isSeat() ? (S.seat || {}) : S;             // 지금 활동의 데이터
const P = p => (isSeat() ? 'seat/' : '') + p;                // 지금 활동의 저장 경로
const phase = () => D().phase || 'setup';
const roles = () => Object.entries(S.roles || {}).map(([id, r]) => ({id, ...r})).sort((a, b) => (a.order || 0) - (b.order || 0));
const students = () => Object.entries(S.students || {}).map(([id, s]) => ({id, ...s})).sort((a, b) => a.no - b.no);
const TESTER = 'tester';                                       // 테스터 계정: 화면 확인용, 결과에 반영 안 됨
const isTester = () => me.sid === TESTER;
const stuName = id => id === TESTER ? '🧪 테스터' : (S.students?.[id]?.name || '?');
const layout = () => S.seat?.layout || {rows: 4, cols: 4, cells: {}};
const cellKey = (r, c) => 'c' + r + '_' + c;
function seatCells(){                                         // 배치도 안의 자리 칸 [{key,r,c,z}]
  const L = layout(), Z = S.seat?.zones || {}, out = [];
  for (let r = 0; r < L.rows; r++) for (let c = 0; c < L.cols; c++){
    const k = cellKey(r, c), z = L.cells?.[k];
    if (z && Z[z]) out.push({key: k, r, c, z});
  }
  return out;
}
function zones(){
  const cells = seatCells();
  return Object.entries(S.seat?.zones || {}).map(([id, z]) => ({id, ...z, emoji: '🪑', slots: cells.filter(c => c.z === id).length}))
    .sort((a, b) => (a.order || 0) - (b.order || 0));
}
function seatItems(){                                         // 자리 하나하나 = 지원 대상
  const Z = S.seat?.zones || {};
  return seatCells().map((c, i) => ({id: c.key, no: i + 1, name: (i + 1) + '번 자리', zone: Z[c.z].name, color: Z[c.z].color, emoji: '🪑', slots: 1, r: c.r, c: c.c}));
}
const items = () => isSeat() ? seatItems() : roles();          // 지원할 대상(역할 또는 자리)
const itemOf = id => isSeat() ? seatItems().find(z => z.id === id) : (S.roles?.[id] ? {id, ...S.roles[id]} : null);
const seatOwner = () => { const o = {}; Object.entries(S.seat?.assigned || {}).forEach(([sid, k]) => o[k] = sid); return o; };
const warnOf = sid => +(D().warn?.[sid]) || 0;
const penalized = sid => warnOf(sid) >= 2;                     // 경고 2번 → 마지막에 선택
const canApply = sid => !penalized(sid) || unassigned().every(s => penalized(s.id));
function apartBad(pos){                                        // 떨어뜨릴 친구가 붙어 앉은 쌍 수
  return Object.values(S.seat?.apart || {}).filter(p => pos[p.a] && pos[p.b] &&
    Math.max(Math.abs(pos[p.a].r - pos[p.b].r), Math.abs(pos[p.a].c - pos[p.b].c)) <= 1).length;
}
function seatPos(){ const it = {}; seatItems().forEach(x => it[x.id] = x); const pos = {}; Object.entries(S.seat?.assigned || {}).forEach(([sid, k]) => { if (it[k]) pos[sid] = it[k]; }); return pos; }
const assigned = () => D().assigned || {};
const rem = id => (+(itemOf(id)?.slots) || 0) - Object.values(assigned()).filter(x => x === id).length;
const unassigned = () => students().filter(s => !assigned()[s.id]);
const totalSlots = () => items().reduce((a, r) => a + (+r.slots || 0), 0);
const dur = () => S.settings?.duration || 180;
const studentLink = () => location.origin + location.pathname + '?room=' + encodeURIComponent(ROOM) + '&mode=student';
const WORD = () => isSeat() ? '자리' : '역할';

function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

function exampleRolesMap(up = {}){
  DEFAULT_ROLES.forEach((d, i) => {
    up['roles/r' + String(i + 1).padStart(2, '0')] = {emoji: d[0], name: d[1], desc: d[2], reason: d[3], time: d[4], slots: d[5], order: i};
  });
  return up;
}
function defaultsMap(){
  const up = {};
  DEFAULT_NAMES.forEach((n, i) => up['students/s' + String(i + 1).padStart(2, '0')] = {no: i + 1, name: n});
  up.phase = 'setup'; up['settings/duration'] = 180;
  return up;
}
function seatDefaultsMap(){
  const up = {}, names = ['앞줄', '둘째 줄', '셋째 줄', '뒷줄'], cells = {};
  names.forEach((n, i) => up['seat/zones/z' + (i + 1)] = {name: n, color: ZONE_COLORS[i], order: i});
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) cells[cellKey(r, c)] = 'z' + (r + 1);
  up['seat/layout'] = {rows: 4, cols: 4, cells};
  up['seat/phase'] = 'setup';
  return up;
}

/* ---------------- 동작 ---------------- */
const act = {
  asStudent(){ me.role = 'student'; render(); },
  asTeacher(){
    const pin = prompt('선생님 비밀번호를 입력하세요');
    if (pin !== TEACHER_PIN){ if (pin !== null) toast('비밀번호가 달라요'); return; }
    me.role = 'teacher'; try { sessionStorage.setItem('oneRole_t_' + ROOM, '1'); } catch(e){}
    render();
  },
  logoutTeacher(){ me.role = null; ui.mod = null; try { sessionStorage.removeItem('oneRole_t_' + ROOM); } catch(e){} render(); },
  chooseMe(sid){ me.sid = sid; try { localStorage.setItem('oneRole_sid_' + ROOM, sid); } catch(e){} render(); },
  forgetMe(){ me.sid = null; try { localStorage.removeItem('oneRole_sid_' + ROOM); } catch(e){} render(); },
  toggleBig(){ ui.bigView = !ui.bigView; render(); },
  openMod(m){
    ui.mod = m; ui.sel = []; ui.swap = null;
    const up = {active: m};
    if (m === 'seat' && !S.seat?.layout) Object.assign(up, seatDefaultsMap());
    if (m === 'pe' && !S.pe?.sports) Object.assign(up, peDefaultsMap());
    store.update(up); window.scrollTo(0, 0);
  },
  hub(){ ui.mod = null; render(); window.scrollTo(0, 0); },

  /* 역할 편집 */
  editRole(id, f, v){ store.set('roles/' + id + '/' + f, v); },
  slot(id, d){ const n = Math.max(1, Math.min(15, (+S.roles[id].slots || 1) + d)); store.set('roles/' + id + '/slots', n); },
  addRole(){
    const order = Math.max(0, ...roles().map(r => r.order || 0)) + 1;
    store.set('roles/' + uid('r'), {emoji: '⭐', name: '새 역할', desc: '', reason: '', time: '쉬는 시간', slots: 1, order});
  },
  delRole(id){ if (confirm('“' + S.roles[id].name + '” 역할을 지울까요?')) store.set('roles/' + id, null); },
  loadExamples(){ if (confirm('예시 역할 11개를 추가할까요?')) store.update(exampleRolesMap()); },
  saveNames(){
    const lines = document.getElementById('names').value.split('\n').map(s => s.trim()).filter(Boolean);
    if (!lines.length) return toast('이름을 한 명 이상 적어 주세요');
    const st = {}; lines.forEach((n, i) => st['s' + String(i + 1).padStart(2, '0')] = {no: i + 1, name: n});
    store.update({students: st}).then(() => toast('명단을 저장했어요 (' + lines.length + '명)'));
  },
  setDur(s){ store.set('settings/duration', s); },

  /* 배치도 편집 (선생님) */
  setPaint(z){ ui.paint = z; render(); },
  paint(k){ store.set('seat/layout/cells/' + k, ui.paint === 'aisle' ? null : ui.paint); },
  resize(f, d){
    const L = layout(); const n = Math.max(1, Math.min(8, L[f] + d));
    const up = {['seat/layout/' + f]: n};
    if (d > 0){ // 새로 생긴 칸은 가장 가까운 구역으로 채움
      const rows = f === 'rows' ? n : L.rows, cols = f === 'cols' ? n : L.cols;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
        const k = cellKey(r, c);
        if ((f === 'rows' && r >= L.rows) || (f === 'cols' && c >= L.cols)){
          const near = L.cells?.[f === 'rows' ? cellKey(L.rows - 1, c) : cellKey(r, L.cols - 1)];
          if (near) up['seat/layout/cells/' + k] = near;
        }
      }
    }
    store.update(up);
  },
  addZone(){
    const zs = zones(); const id = uid('z');
    store.set('seat/zones/' + id, {name: '새 구역', color: ZONE_COLORS[zs.length % ZONE_COLORS.length], order: zs.length});
    ui.paint = id;
  },
  renameZone(id, v){ store.set('seat/zones/' + id + '/name', v.trim() || '구역'); },
  delZone(id){
    if (!confirm('이 구역을 지울까요? 이 구역 칸은 통로가 돼요.')) return;
    const up = {['seat/zones/' + id]: null};
    Object.entries(layout().cells || {}).forEach(([k, z]) => { if (z === id) up['seat/layout/cells/' + k] = null; });
    if (ui.paint === id) ui.paint = 'aisle';
    store.update(up);
  },
  /* 선생님만 보는 설정 */
  selStu(sid){ const i = ui.sel.indexOf(sid); if (i >= 0) ui.sel.splice(i, 1); else { ui.sel.push(sid); if (ui.sel.length > 2) ui.sel.shift(); } render(); },
  unfix(sid){ store.set('seat/fixed/' + sid, null); },
  addApart(){ if (ui.sel.length !== 2) return; store.set('seat/apart/' + uid('a'), {a: ui.sel[0], b: ui.sel[1]}); ui.sel = []; },
  delApart(id){ store.set('seat/apart/' + id, null); },

  /* 지원 · 미니게임 (두 활동 공통) */
  startRound(){
    const first = phase() === 'setup';
    const d = dur();
    const up = {[P('phase')]: 'apply', [P('round')]: first ? 1 : (D().round || 1) + 1, [P('picks')]: null, [P('games')]: null,
                [P('endsAt')]: store.now() + d * 1000, [P('duration')]: d};
    if (first){
      if (isSeat()){
        const fx = {}, ks = new Set(seatItems().map(z => z.id)), used = new Set();
        Object.entries(S.seat?.fixed || {}).forEach(([sid, k]) => { if (S.students?.[sid] && ks.has(k) && !used.has(k)){ fx[sid] = k; used.add(k); } });
        up['seat/assigned'] = Object.keys(fx).length ? fx : null;
      } else up.assigned = null;
    }
    store.update(up);
  },
  addTime(sec){ store.update({[P('endsAt')]: (D().endsAt || store.now()) + sec * 1000, [P('duration')]: (D().duration || dur()) + sec}); },
  pick(id){
    if (phase() !== 'apply' || store.now() > (D().endsAt || 0)) return toast('지원 시간이 끝났어요');
    if (assigned()[me.sid]) return;
    if (!canApply(me.sid)) return toast('경고 2번! 다른 친구들이 모두 고른 뒤에 고를 수 있어요');
    if (rem(id) <= 0) return toast(isSeat() ? '이미 주인이 정해진 자리예요' : '남은 자리가 없어요');
    store.set(P('picks/' + me.sid), id);
  },
  async closeRound(){
    if (closing || phase() !== 'apply') return;
    closing = true;
    try {
      const picks = D().picks || {}, un = unassigned(), up = {}, games = {}, byItem = {};
      un.forEach(s => { const r = picks[s.id]; if (r && canApply(s.id) && itemOf(r) && rem(r) > 0) (byItem[r] = byItem[r] || []).push(s.id); });
      let newly = 0;
      for (const [rid, ids] of Object.entries(byItem)){
        const R = rem(rid);
        if (ids.length <= R){ ids.forEach(id => { up[P('assigned/' + id)] = rid; newly++; }); }
        else {
          const wins = shuffle([...Array(ids.length).keys()]).slice(0, R);
          const cards = {}; for (let i = 0; i < ids.length; i++) cards['c' + i] = {win: wins.includes(i)};
          const players = {}; ids.forEach(id => players[id] = true);
          games[rid] = {slots: R, players, cards, revealed: false};
        }
      }
      const hasGame = Object.keys(games).length > 0;
      up[P('games')] = hasGame ? games : null;
      up[P('phase')] = hasGame ? 'game' : (un.length - newly === 0 ? 'done' : 'closed');
      up[P('endsAt')] = null;
      await store.update(up);
    } finally { closing = false; }
  },
  async pickCard(rid, cid){
    const g = D().games?.[rid];
    if (!g || g.revealed || !g.players?.[me.sid]) return;
    if (Object.values(g.cards || {}).some(c => c.by === me.sid)) return;
    const ok = await store.claim(P('games/' + rid + '/cards/' + cid + '/by'), me.sid);
    if (!ok) toast('앗, 다른 친구가 먼저 골랐어요! 다른 카드를 골라요');
  },
  autoFill(rid, up){
    const g = D().games[rid]; const cards = g.cards || {};
    const taken = new Set(Object.values(cards).map(c => c.by).filter(Boolean));
    const waiting = shuffle(Object.keys(g.players || {}).filter(p => !taken.has(p)));
    const free = Object.keys(cards).filter(cid => !cards[cid].by);
    waiting.forEach((sid, i) => { if (free[i]) up[P('games/' + rid + '/cards/' + free[i] + '/by')] = sid; });
    return up;
  },
  autoPick(rid){ store.update(act.autoFill(rid, {})); },
  revealUp(rid, up){
    act.autoFill(rid, up);
    const cards = D().games[rid].cards || {};
    for (const cid in cards){
      const by = up[P('games/' + rid + '/cards/' + cid + '/by')] || cards[cid].by;
      if (cards[cid].win && by) up[P('assigned/' + by)] = rid;
    }
    up[P('games/' + rid + '/revealed')] = true;
    return up;
  },
  reveal(rid){ store.update(act.revealUp(rid, {})); },
  revealAll(){
    const up = {};
    Object.entries(D().games || {}).forEach(([rid, g]) => { if (!g.revealed) act.revealUp(rid, up); });
    store.update(up);
  },
  afterGames(){ store.update({[P('games')]: null, [P('phase')]: unassigned().length ? 'closed' : 'done'}); },
  randomRest(){
    if (isSeat()){
      const un = unassigned().map(s => s.id), free = seatItems().filter(x => rem(x.id) > 0), base = seatPos();
      let best = null, bestBad = Infinity;
      for (let t = 0; t < 300 && bestBad > 0; t++){
        const ss = shuffle(free.slice()), pos = Object.assign({}, base), m = {};
        shuffle(un.slice()).forEach((sid, i) => { if (ss[i]){ m[sid] = ss[i].id; pos[sid] = ss[i]; } });
        const bad = apartBad(pos); if (bad < bestBad){ best = m; bestBad = bad; }
      }
      const up = {}; Object.entries(best || {}).forEach(([sid, k]) => up['seat/assigned/' + sid] = k);
      up['seat/phase'] = un.length - Object.keys(best || {}).length === 0 ? 'done' : 'closed';
      store.update(up); return;
    }
    const un = shuffle(unassigned().map(s => s.id));
    const seats = []; items().forEach(r => { for (let i = 0; i < rem(r.id); i++) seats.push(r.id); });
    shuffle(seats);
    const up = {}; let left = un.length;
    un.forEach((sid, i) => { if (seats[i]){ up[P('assigned/' + sid)] = seats[i]; left--; } });
    up[P('phase')] = left === 0 ? 'done' : 'closed';
    store.update(up);
  },
  backToSetup(){
    if (!confirm('지원 결과를 지우고 토의 단계로 돌아갈까요? (제안·명단·설정은 그대로 남아요)')) return;
    const up = {[P('phase')]: 'setup', [P('assigned')]: null, [P('picks')]: null, [P('games')]: null, [P('round')]: null, [P('endsAt')]: null, [P('warn')]: null};
    store.update(up);
  },
  resetAll(){
    if (!confirm('역할·자리·명단·제안을 모두 지우고 처음 상태로 되돌릴까요?')) return;
    store.update({roles: null, students: null, proposals: null, assigned: null, picks: null, games: null, round: null, endsAt: null, seat: null, pe: null, active: null})
      .then(() => store.update(defaultsMap()));
    ui.mod = null;
  },
  print(){ window.print(); },

  /* 경고 */
  warn(sid, d){
    const n = Math.max(0, Math.min(2, warnOf(sid) + d));
    const up = {[P('warn/' + sid)]: n || null};
    if (n >= 2) up[P('picks/' + sid)] = null;
    store.update(up);
    if (d > 0) toast(stuName(sid) + ' 경고 ' + n + '번' + (n >= 2 ? ' → 마지막에 선택' : ''));
  },
  /* 자리 바꾸기 (선생님, 결과 화면) */
  tapSeat(k){
    if (!ui.swap){ ui.swap = k; render(); return; }
    if (ui.swap === k){ ui.swap = null; render(); return; }
    const own = seatOwner(), from = ui.swap, a = own[from], b = own[k];
    ui.swap = null;
    const up = {}; if (a) up['seat/assigned/' + a] = k; if (b) up['seat/assigned/' + b] = from;
    if (a || b) store.update(up); else render();
  },
  fixSeat(k){
    if (ui.sel.length !== 1) return toast('먼저 친구 1명을 골라 주세요');
    const up = {}; Object.entries(S.seat?.fixed || {}).forEach(([sid, kk]) => { if (kk === k) up['seat/fixed/' + sid] = null; });
    up['seat/fixed/' + ui.sel[0]] = k; ui.sel = []; store.update(up);
  },

  /* 학생 제안: 역할 */
  draftSlot(d){ ui.draft.slots = Math.max(1, Math.min(15, ui.draft.slots + d)); render(); },
  draftTime(t){ ui.draft.time = t; render(); },
  propose(){
    const d = ui.draft;
    if (!d.name.trim()) return toast('역할 이름을 적어 주세요');
    store.set('proposals/' + uid('p'), {name: d.name.trim(), desc: d.desc.trim(), reason: d.reason.trim(), time: d.time, slots: d.slots, by: me.sid, at: store.now(), test: isTester() || null})
      .then(() => toast('제안을 보냈어요! 📮'));
    ui.draft = emptyDraft();
    if (document.activeElement) document.activeElement.blur();
    render();
  },
  adopt(pid){
    const pr = S.proposals[pid]; const rid = uid('r');
    const order = Math.max(0, ...roles().map(r => r.order || 0)) + 1;
    store.update({['roles/' + rid]: {emoji: '⭐', name: pr.name, desc: pr.desc || '', reason: pr.reason || '', time: pr.time || '쉬는 시간', slots: pr.slots || 1, order},
                  ['proposals/' + pid + '/adopted']: rid});
    toast('“' + pr.name + '” 역할을 추가했어요');
  },
  /* 학생 제안: 자리 원칙 */
  sendIdea(){
    const t = ui.idea.trim();
    if (!t) return toast('의견을 적어 주세요');
    store.set('seat/ideas/' + uid('i'), {text: t, by: me.sid, at: store.now(), test: isTester() || null}).then(() => toast('의견을 보냈어요! 📮'));
    ui.idea = '';
    if (document.activeElement) document.activeElement.blur();
    render();
  },
  adoptIdea(id){ const v = !S.seat?.ideas?.[id]?.adopted; store.set('seat/ideas/' + id + '/adopted', v || null); },
  /* 공감·삭제 (공통) */
  like(path){
    const has = path.split('/').reduce((c, k) => c?.[k], S)?.likes?.[me.sid];
    store.set(path + '/likes/' + me.sid, has ? null : true);
  },
  delPost(path){ if (confirm('이 제안을 지울까요?')) store.set(path, null); }
};

/* ---------------- 이름 끌어다 놓기 ---------------- */
function startDrag(e){
  if (!e.isPrimary) return;
  e.preventDefault();
  const ghost = e.currentTarget.cloneNode(true);
  ghost.classList.add('ghost'); ghost.removeAttribute('onpointerdown');
  document.body.appendChild(ghost);
  const zoneAt = ev => document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-drop]');
  const clearHover = () => document.querySelectorAll('.hover').forEach(x => x.classList.remove('hover'));
  const move = ev => {
    ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
    clearHover(); const el = zoneAt(ev);
    if (el) document.querySelectorAll(`[data-drop="${el.dataset.drop}"]`).forEach(x => x.classList.add('hover'));
  };
  const up = ev => {
    document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
    ghost.remove(); clearHover();
    const el = ev.type === 'pointerup' ? zoneAt(ev) : null;
    if (el) act.pick(el.dataset.drop);
  };
  move(e);
  document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
}

/* ---------------- 공통 조각 ---------------- */
function roleCard(r, extra = '', cls = '', click = ''){
  return `<div class="rcard ${cls}" ${click ? `onclick="${click}"` : ''}>
    <div class="rtop"><span class="em">${esc(r.emoji)}</span><div><div class="rn">${esc(r.name)}</div><div class="tag">${r.time ? '🕘 ' + esc(r.time) + ' · ' : ''}👥 ${r.slots}${isSeat() ? '자리' : '명'}</div></div></div>
    ${r.desc ? `<div class="desc">🛠 ${esc(r.desc)}</div>` : ''}
    ${r.reason ? `<div class="reason">💡 ${esc(r.reason)}</div>` : ''}
    ${extra}</div>`;
}
function roleEditor(r){
  return `<div class="rcard edit">
    <div class="row"><input class="emoji" value="${esc(r.emoji)}" onchange="act.editRole('${r.id}','emoji',this.value)">
      <input class="rname" value="${esc(r.name)}" placeholder="역할 이름" onchange="act.editRole('${r.id}','name',this.value)">
      <button class="x" title="지우기" onclick="act.delRole('${r.id}')">🗑</button></div>
    <label>🛠 하는 일</label><textarea rows="2" onchange="act.editRole('${r.id}','desc',this.value)">${esc(r.desc)}</textarea>
    <label>💡 추천 이유 (왜 필요할까?)</label><textarea rows="2" onchange="act.editRole('${r.id}','reason',this.value)">${esc(r.reason)}</textarea>
    <label>🕘 하는 시간</label><div class="chips sm">${TIMES.map(t => `<button class="chip ${r.time === t ? 'on' : ''}" onclick="act.editRole('${r.id}','time','${t}')">${t}</button>`).join('')}</div>
    <label>👥 인원</label><div class="stepper"><button onclick="act.slot('${r.id}',-1)">−</button><b>${r.slots}명</b><button onclick="act.slot('${r.id}',1)">＋</button></div>
  </div>`;

const timerHtml = () => `<div class="timer" data-timer><div class="tnum">--</div><div class="tbar"><i></i></div></div>`;
function stepper(){
  const idx = {setup: 0, apply: 1, game: 2, closed: 2, done: 3}[phase()] ?? 0;
  const st = isSeat() ? ['① 원칙 토의', '② 자리 지원', '③ 미니게임', '④ 자리 배치'] : ['① 역할 토의', '② 지원하기', '③ 미니게임', '④ 결과'];
  return `<div class="steps">${st.map((s, i) => `<span class="${i === idx ? 'on' : i < idx ? 'done' : ''}">${s}</span>`).join('')}</div>`;
}
function modeBanner(){
  return store.mode === 'local' ? `<div class="banner">🧪 <b>체험 모드</b>예요. 이 브라우저 안에서만 저장돼요. 다른 탭에서 <code>?mode=student</code> 주소로 열면 학생 화면을 함께 시험해 볼 수 있어요.</div>` : '';
}
function linkPanel(){
  const l = studentLink();
  return `<section class="panel noprint"><h3>📲 학생 접속 주소</h3><div class="qr">
    <img width="150" height="150" alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(l)}" onerror="this.remove()">

function resultBoard(){
  const A = S.assigned || {}, rs = roles();
  const times = [...TIMES, ...new Set(rs.map(r => r.time).filter(t => !TIMES.includes(t)))];
  return `<section class="panel"><h2>📋 우리 반 1인 1역</h2>${times.map(t => {
    const list = rs.filter(r => r.time === t); if (!list.length) return '';
    return `<h3 class="time">🕘 ${esc(t)}</h3>${list.map(r => {
      const ns = Object.keys(A).filter(s => A[s] === r.id).map(stuName);
      const empty = Math.max(0, (+r.slots || 0) - ns.length);
      return `<div class="rrow"><span class="em">${esc(r.emoji)}</span><b>${esc(r.name)}</b><span class="rdesc">${esc(r.desc)}</span>
        <span class="names">${ns.map(n => `<span class="nm">${esc(n)}</span>`).join('')}${'<span class="nm empty">빈자리</span>'.repeat(empty)}</span></div>`;
    }).join('')}`;

function myRoleBox(r, title){
  if (isSeat()) return `<div class="myrole"><div class="em">🪑</div><div class="hint">${title || '나의 자리'}</div><h2><span class="zdot" style="background:${r.color}"></span> ${esc(r.name)}</h2><div class="tag">${esc(r.zone)}</div></div>`;
  return `<div class="myrole"><div class="em">${esc(r.emoji)}</div><div class="hint">${title || '나의 역할'}</div><h2>${esc(r.name)}</h2>
    <div class="tag">🕘 ${esc(r.time)}</div>${r.desc ? `<p>🛠 ${esc(r.desc)}</p>` : ''}</div>`;

function cardHtml(rid, cid, c, g, who){
  const mine = who !== 'teacher' && c.by && c.by === me.sid;
  const showName = who === 'teacher' || g.revealed;
  const label = c.by ? (showName ? esc(stuName(c.by)) : (mine ? '내 카드' : '선택됨')) : '';
  const canPick = who === 'student' && !g.revealed && !c.by && g.players?.[me.sid] && !Object.values(g.cards || {}).some(x => x.by === me.sid);
  return `<button class="pcard ${g.revealed ? 'flip' : ''} ${c.by ? 'taken' : ''} ${mine ? 'mine' : ''} ${g.revealed && c.win ? 'win' : ''}" ${canPick ? `onclick="act.pickCard('${rid}','${cid}')"` : 'disabled'}>
    <span class="inner"><span class="back">❓<small>${label}</small></span><span class="front">${c.win ? '🎉' : '🍀'}<small>${label}</small></span></span></button>`;
}
function gameBoard(rid, g, who){
  const r = itemOf(rid) || {};
  const cards = Object.entries(g.cards || {}).sort((a, b) => +a[0].slice(1) - +b[0].slice(1));
  const players = Object.keys(g.players || {});
  const taken = new Set(cards.map(([, c]) => c.by).filter(Boolean));
  const waiting = players.filter(p => !taken.has(p));
  return `<section class="panel center">
    <h3>${esc(r.emoji)} ${esc(r.name)} — <b>${g.slots}</b>자리에 <b>${players.length}</b>명 지원</h3>
    <div class="cards">${cards.map(([cid, c]) => cardHtml(rid, cid, c, g, who)).join('')}</div>
    ${who === 'teacher' && !g.revealed ? `<div class="row center">
      ${waiting.length ? `<span class="hint">카드 고르는 중: ${waiting.map(p => esc(stuName(p))).join(', ')}</span><button class="btn" onclick="act.autoPick('${rid}')">남은 카드 대신 뽑기</button>` : '<span class="hint">모두 골랐어요!</span>'}
      <button class="btn primary" onclick="act.reveal('${rid}')">✨ 결과 공개</button></div>` : ''}
  </section>`;
}
const likeCount = p => Object.keys(p.likes || {}).filter(k => k !== TESTER).length;
const visiblePost = p => !p.test || isTester() || me.role === 'teacher';

/* 교실 배치도 그리기: mode = edit | apply | view | final */
function gridHtml(mode){
  const L = layout(), Z = S.seat?.zones || {}, own = seatOwner(), teacher = me.role === 'teacher';
  const no = {}; seatItems().forEach(x => no[x.id] = x.no);
  const picks = S.seat?.picks || {}, myPick = picks[me.sid], fixedAt = {};
  Object.entries(S.seat?.fixed || {}).forEach(([sid, k]) => fixedAt[k] = sid);
  const apply = mode === 'apply' && S.seat?.phase === 'apply';
  let h = `<div class="classroom"><div class="desk">🧑‍🏫 교탁 · 칠판 (앞)</div><div class="sgrid" style="grid-template-columns:repeat(${L.cols},1fr)">`;
  for (let r = 0; r < L.rows; r++) for (let c = 0; c < L.cols; c++){
    const k = cellKey(r, c), z = L.cells?.[k], zone = z && Z[z];
    if (!zone){ h += `<div class="cell aisle" ${mode === 'edit' ? `onclick="act.paint('${k}')"` : ''}>${mode === 'edit' ? '통로' : ''}</div>`; continue; }
    const st = `style="background:${zone.color}"`, num = `<span class="sno">${no[k]}</span>`;
    if (mode === 'edit'){ h += `<div class="cell" ${st} onclick="act.paint('${k}')">${num}${esc(zone.name)}</div>`; continue; }
    if (mode === 'fix'){ h += `<div class="cell" ${st} onclick="act.fixSeat('${k}')">${num}<b>${fixedAt[k] ? '📌 ' + esc(stuName(fixedAt[k])) : ''}</b></div>`; continue; }
    const sid = own[k];
    if (sid){   // 주인이 정해진 자리
      const click = teacher && mode === 'final' && S.seat?.phase === 'done' ? `onclick="act.tapSeat('${k}')"` : '';
      h += `<div class="cell seat taken ${sid === me.sid && !teacher ? 'mine' : ''} ${ui.swap === k && teacher ? 'swap' : ''}" ${st} ${click}>${num}<b>${esc(stuName(sid))}</b></div>`;
      continue;
    }
    if (apply){
      const ap = Object.keys(picks).filter(s2 => S.students?.[s2] && picks[s2] === k && !own[k] && !(S.seat?.assigned || {})[s2]);
      const who = teacher ? ap.map(x => esc(stuName(x))).join(' · ') : (myPick === k ? '✋ 나' : '');
      h += `<div class="cell drop ${myPick === k ? 'mine' : ''} ${ap.length > 1 ? 'crowd' : ''}" ${st} data-drop="${k}" ${!teacher ? `onclick="act.pick('${k}')"` : ''}>
        ${num}${ap.length ? `<span class="badge">${ap.length}</span>` : ''}<b>${who}</b></div>`;
      continue;
    }
    const click = teacher && mode === 'final' && S.seat?.phase === 'done' ? `onclick="act.tapSeat('${k}')"` : '';
    h += `<div class="cell seat ${ui.swap === k && teacher ? 'swap' : ''}" ${st} ${click}>${num}<small>${mode === 'final' ? '빈자리' : esc(zone.name)}</small></div>`;
  }
  return h + '</div></div>';
}

/* ---------------- 체육 팀 나누기 (선생님이 나누고, 학생 태블릿에 공개) ---------------- */
const PE_COLORS = [['빨강','#e5383b','#fff'],['파랑','#2f6fde','#fff'],['노랑','#f2c230','#2b2b3a'],['초록','#2a9d5c','#fff'],['주황','#f07b22','#fff'],['보라','#8a5cd6','#fff'],['분홍','#e8609a','#fff'],['하늘','#3fb6d9','#2b2b3a']];
const PE_PAIR = ['#ffb4a2','#a0c4ff','#caffbf','#ffd6a5','#bdb2ff','#9bf6ff','#ffc6ff','#fdffb6'];
const PE_DEFAULT_SPORTS = ['피구','킨볼','배드민턴','티볼'];
const PE_DEFAULT_RULES = ["팀이 정해지면 '바꿔 주세요'는 하지 않아요.", "인원이 적은 팀이 먼저 공격(선공)해요.", "남는 친구는 심판 보조·기록원을 돌아가며 맡아요.", "이긴 팀보다 멋진 행동을 한 친구를 칭찬해요.", "경기가 끝나면 상대 팀과 하이파이브해요."];
const nk = n => String(n).replace(/[.#$\[\]\/]/g, '_');
const peArr = v => Array.isArray(v) ? v.filter(x => x != null) : Object.values(v || {});
const PE = () => S.pe || {};
const peCur = () => Object.assign({mode: 'team', k: 3, method: 'balance', odd: 'uneven'}, PE().cur || {});
const peSports = () => Object.entries(PE().sports || {}).map(([id, s]) => ({id, ...s})).sort((a, b) => (a.order || 0) - (b.order || 0));
const peSport = () => { const ss = peSports(); return ss.find(s => s.id === peCur().sport) || ss[0]; };
const peRate = (n, sp = peSport()) => +(sp?.ratings?.[nk(n)]) || 3;
const peNames = () => students().map(s => s.name);
const pePresent = () => peNames().filter(n => !PE().absent?.[nk(n)]);
const peRules = () => peArr(PE().rules).filter(r => String(r).trim());
const peFixed = sp => { const f = PE().fixed?.[sp?.id]; return f ? {date: f.date, groups: peArr(f.groups).map(peArr)} : null; };
const peDays = d => Math.floor((Date.now() - new Date(d + 'T00:00:00').getTime()) / 864e5);
const peToday = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function peDefaultsMap(){
  const up = {};
  PE_DEFAULT_SPORTS.forEach((n, i) => up['pe/sports/p' + (i + 1)] = {name: n, order: i});
  up['pe/cur'] = {sport: 'p1', mode: 'team', k: 3, method: 'balance', odd: 'uneven'};
  up['pe/rules'] = PE_DEFAULT_RULES; up['pe/rotate'] = 28;
  return up;
}
const peSort = (ns, sp) => shuffle(ns.slice()).sort((a, b) => peRate(b, sp) - peRate(a, sp));
function peHelpers(ns, n){ const hc = PE().helperCount || {}; return shuffle(ns.slice()).sort((a, b) => (+hc[nk(a)] || 0) - (+hc[nk(b)] || 0)).slice(0, n); }
function peTeams(ns, k, method, sp){
  if (method === 'fixed'){                                     // 고정 팀: 결석은 빠지고 새 친구는 적은 팀으로
    const g = peFixed(sp).groups.map(t => t.filter(n => ns.includes(n)));
    ns.filter(n => !g.flat().includes(n)).forEach(n => g.reduce((m, t) => t.length < m.length ? t : m).push(n));
    return g;
  }

      body = `<div class="result-msg">${msg}</div>${gameBoard(rid, g, 'student')}`;
    } else {
      body = (mr ? myRoleBox(mr) : '') + `<section class="panel center"><h2>🎲 친구들이 미니게임 중이에요</h2></section>` +
        gs.map(([rid, g]) => gameBoard(rid, g, 'view')).join('');
    }
  } else if (p === 'closed'){
    body = mr ? myRoleBox(mr) + `<p class="center hint">남은 친구들의 다음 지원을 기다려요.</p>`
      : `<section class="panel center"><h2>🙌 다음 지원을 준비하고 있어요</h2><p>남은 ${WORD()} 중에서 어디로 갈지 미리 생각해 둬요!</p></section>
         ${warnBanner()}${isSeat() ? gridHtml('final') : `<div class="grid">${items().filter(r => rem(r.id) > 0).map(r => roleCard({...r, slots: rem(r.id)})).join('')}</div>`}`;
  } else if (p === 'done'){
    if (isSeat()) body = `<section class="panel center"><h2>🎊 우리 반 자리 배치</h2><p class="hint">주황 테두리가 내 자리예요</p></section>${principles()}${gridHtml('final')}`;
    else body = (mr ? myRoleBox(mr) : '') + resultBoard();
  }
  return head + title + stepper() + body;
}

/* ---------------- 그리기 ---------------- */
function home(){
  return `<div class="home"><div class="logo">🏗️</div><h1>교실 설계소</h1><p>우리 반의 역할·자리·체육 팀을 함께 설계해요!</p>
    <button class="btn big primary" onclick="act.asStudent()">🧒 학생으로 들어가기</button>
    <button class="btn big" onclick="act.asTeacher()">🧑‍🏫 선생님</button>${modeBanner()}</div>`;
}
function render(){
  const a = document.activeElement;
  if (a && a.closest && a.closest('#app') && /^(INPUT|TEXTAREA)$/.test(a.tagName)){ pending = true; return; }
  MOD = me.role === 'teacher' ? (ui.mod || 'role') : (S.active || 'role');
  const y = window.scrollY;
  document.getElementById('app').innerHTML = me.role === 'teacher' ? teacherView() : me.role === 'student' ? studentView() : home();
  window.scrollTo(0, y);
  tick();
}
document.addEventListener('focusout', () => { if (pending){ pending = false; setTimeout(render, 300); } });

let lastExpired = null;
function tick(){
  if (me.role === 'teacher' && !ui.mod) return;
  if (MOD === 'pe') return;
  if (phase() !== 'apply') return;
  const left = Math.max(0, (D().endsAt || 0) - store.now());
  const total = (D().duration || dur()) * 1000;
  document.querySelectorAll('[data-timer]').forEach(el => {
    const s = Math.ceil(left / 1000);
    el.querySelector('.tnum').textContent = left > 0 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : '마감!';
    el.querySelector('.tbar i').style.width = Math.min(100, left / total * 100) + '%';
    el.classList.toggle('hurry', left < 10000);
  });
  if (left <= 0){
    if (me.role === 'teacher') act.closeRound();
    else if (lastExpired !== MOD + D().round + ':' + D().endsAt){ lastExpired = MOD + D().round + ':' + D().endsAt; render(); }
  }
}
setInterval(tick, 250);

store.subscribe(v => { S = v || {}; loaded = true; render(); });
render();
</script>
</body>
